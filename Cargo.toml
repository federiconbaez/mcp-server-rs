[package]
name = "mcp-server-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Model Context Protocol server written from scratch in Rust (no official SDK): stdio + Streamable HTTP, JSON-RPC 2.0, seccomp-sandboxed example tool."
authors = ["Federico Nicolas Báez Rizzo"]
repository = "https://github.com/federiconbaez/mcp-server-rs"
readme = "README.md"
keywords = ["mcp", "json-rpc", "seccomp", "sandbox", "protocol"]
categories = ["network-programming", "command-line-utilities"]

[lib]
name = "mcp_server"
path = "src/lib.rs"

[[bin]]
name = "mcp-server-rs"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tiny_http = "0.12"
getrandom = "0.2"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
